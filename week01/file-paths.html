<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Path Activity</title>
</head>

<body>
    <h1>File Path Activity</h1>
    <p>Fix the image tags below so that they each display the correct image.</p>

    <p>A temple image file in the images subfolder:</p>
    <img src="/week01/images/aba-nigeria-temple.jpeg" alt="The Aba Nigeria Temple">

    <p>A temple image file in the root images folder:</p>
    <img src="/images/salt-lake-temple.jpg" alt="The Salt Lake Temple">

    <p>A temple image file with an absolute path:</p>
    <img
      src="https://www.churchofjesuschrist.org/imgs/fac2f821c9895e1acd1325cbdb3fa447c4bb4e19/full/1280%2C/0/default"
      alt="The Anchorage Alaska Temple" width="350">

</body>

</html>
